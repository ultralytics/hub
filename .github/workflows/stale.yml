name: Close stale issues
on:
  schedule:
    - cron: "0 0 * * *" # Runs at 00:00 UTC every day

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          stale-issue-message: |
            👋 Hello there! We wanted to give you a friendly reminder that this issue has not had any recent activity and may be closed soon, but don't worry - you can always reopen it if needed. If you still have any questions or concerns, please feel free to let us know how we can help.

            The managed HUB-to-Platform migration was completed during Q2 2026, and HUB shut down on July 31, 2026. Legacy HUB API keys no longer work. Create a new account and API key for Ultralytics Platform, then use these current resources:

            - **Platform**: https://platform.ultralytics.com
            - **Platform Docs**: https://docs.ultralytics.com/platform
            - **Community**: https://community.ultralytics.com

            Submit feedback about current Platform workflows from the **Help** page in Platform. HUB issues, feature requests, and pull requests are no longer accepted.

          stale-pr-message: |
            👋 Hello there! We wanted to let you know that we've decided to close this pull request due to inactivity. We appreciate the effort you put into contributing to our project, but unfortunately, not all contributions are suitable or aligned with our product roadmap.

            We hope you understand our decision, and please don't let it discourage you from contributing to open source projects in the future. We value all of our community members and their contributions, and we encourage you to keep exploring new projects and ways to get involved.

            The managed HUB-to-Platform migration was completed during Q2 2026, and HUB shut down on July 31, 2026. New work belongs on Ultralytics Platform:

            - **Platform**: https://platform.ultralytics.com
            - **Platform Docs**: https://docs.ultralytics.com/platform
            - **Community**: https://community.ultralytics.com

            HUB pull requests are no longer accepted. Thank you for your past contributions to YOLO 🚀 and Vision AI ⭐

          days-before-issue-stale: 30
          days-before-issue-close: 10
          days-before-pr-stale: 90
          days-before-pr-close: 30
          exempt-issue-labels: "documentation,tutorial,TODO"
          operations-per-run: 300 # The maximum number of operations per run, used to control rate limiting.
